# Tests + lcov upload — aligned with FabricLabs/fabric (report:coverage + Codecov).
name: CI

on:
  push:
    branches: [main, master, develop, 'feature/**']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  FABRIC_ACTION_DEBUG_URL: http://127.0.0.1:3044/api/endpoint
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb and Playwright OS deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium

      - name: Run tests (with coverage for Codecov)
        # Headed Chromium so MV3 `--load-extension` starts a service worker.
        # Playwright `headless: true` uses chromium-headless-shell, which cannot.
        env:
          PLAYWRIGHT_CHROMIUM_USE_HEADLESS_SHELL: '0'
        run: xvfb-run --auto-servernum npm run report:coverage

      - name: Send coverage report
        uses: codecov/codecov-action@v4
        with:
          directory: ./reports/
        continue-on-error: true
