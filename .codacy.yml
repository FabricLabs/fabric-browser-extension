# Codacy — generated / vendor / report trees must not gate RSI (0-new-issue cap).
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/
---
engines:
  remark-lint:
    enabled: false
  duplication:
    enabled: false
  lizard:
    exclude_paths:
      - "src/UIElements/**"
      - "src/background/**"
exclude_paths:
  - "assets/**"
  - "libraries/**"
  - "reports/**"
  - "docs/**"
  - "tests/**"
  - "scripts/**"
  - "zip/**"
  - "coverage/**"
  - "stores/**"
  - "logs/**"
  - "SECURITY.md"
  - "CLAUDE.md"
  - "src/types/**"
  - "src/UIElements/**"
